name: Test AWS SSM Connection

on:
  push:
    branches:
      - dev_sarfaraz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-aws-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Authentication
        run: |
          aws sts get-caller-identity \
            --query 'Arn' \
            --output text

      - name: Test SSM Command
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          INSTANCE_ID: i-06adc4ece8b7e71b9
        shell: bash
        run: |
          cat > /tmp/ssm-parameters.json <<'JSON'
          {
            "commands": [
              "echo USER:",
              "sudo -iu ubuntu whoami",
              "echo NODE VERSION:",
              "sudo -iu ubuntu bash -lc 'node -v'",
              "echo NPM VERSION:",
              "sudo -iu ubuntu bash -lc 'npm -v'",
              "echo PM2 PROCESS DETAILS:",
              "sudo -iu ubuntu bash -lc 'pm2 describe my-hmvc-backend'",
              "echo GIT PROJECT DIRECTORIES:",
              "find /home/ubuntu -maxdepth 4 -type d -name .git"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command submitted successfully"
          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
