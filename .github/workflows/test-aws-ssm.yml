name: Test AWS SSM Connection

on:
  push:
    branches:
      - dev_sarfaraz
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-aws-ssm:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Authentication
        run: |
          aws sts get-caller-identity \
            --query 'Arn' \
            --output text

      - name: Test SSM Command
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          INSTANCE_ID: i-06adc4ece8b7e71b9
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{
              "commands": [
                "sudo -iu ubuntu bash -lc '\''echo \"USER=$USER\"; \
                echo \"NODE VERSION:\"; node -v; \
                echo \"NPM VERSION:\"; npm -v; \
                echo \"PROJECT DIRECTORY:\"; \
                find /home/ubuntu -maxdepth 3 -type d -name \"HMVC-Backend-FullStack\"; \
                echo \"PM2 PROCESSES:\"; pm2 list'\''"
              ]
            }' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command submitted successfully"

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
