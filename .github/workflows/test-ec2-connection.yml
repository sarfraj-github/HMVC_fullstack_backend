name: Test EC2 SSH Connection

on:
  push:
    branches:
      - dev_sarfaraz

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Validate EC2 Host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [[ -z "$EC2_HOST" ]]; then
            echo "EC2_HOST is empty"
            exit 1
          fi

          if [[ "$EC2_HOST" =~ [[:space:]/@:] ]]; then
            echo "EC2_HOST contains invalid characters"
            exit 1
          fi

          echo "EC2_HOST format looks valid"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY}}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Test EC2 Connection
        run: |
          ssh -o StrictHostKeyChecking=accept-new \ 
              -o ConnectTimeout=10\
              -i ~/.ssh/ec2_key \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST}}" \
              "echo 'EC2 SSH Connection successful!'"
