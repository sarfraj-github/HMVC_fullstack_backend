name: Test EC2 SSH Connection

on:
  push:
    branches:
      - dev_sarfaraz

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Validate EC2 Credentials
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          if [[ -z "$EC2_HOST" || -z "$EC2_USER" ]]; then
            echo "EC2_HOST or EC2_USER is empty"
            exit 1
          fi

          if [[ ! "$EC2_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "Invalid EC2_HOST format"
            exit 1
          fi

          if [[ ! "$EC2_USER" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Invalid EC2_USER format"
            exit 1
          fi

          echo "EC2_HOST validation passed"
          echo "EC2_USER validation passed"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY}}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Test EC2 Connection
        run: |
          ssh -o StrictHostKeyChecking=accept-new \ 
              -o ConnectTimeout=10\
              -i ~/.ssh/ec2_key \
              "$EC2_USER@$EC2_HOST" \
              "echo 'EC2 SSH Connection successful!'"
