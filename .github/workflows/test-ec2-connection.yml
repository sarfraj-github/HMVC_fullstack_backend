name: Test EC2 SSH Connection

on:
  push:
    branches:
      - dev_sarfaraz

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          EC2_PRIVATE_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$EC2_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null

      - name: Test EC2 Connection
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10\
              -i ~/.ssh/ec2_key \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST}}" \
              "echo 'EC2 SSH Connection successful!'"
