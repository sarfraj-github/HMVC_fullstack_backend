name: Backend - CI Pipeline

# Trigger workflow whenever code is pushed to main
on:
  push:
    branches:
      - main

# Define workflow jobs
jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      # Step 1.  Get repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run Jest tests
      - name: Run backend tests
        run: npm test -- --runInBand

      # Step 5: Validate backend JavaScript syntax
      - name: Check JavaScript syntax
        run: node --check start.js

      # Step 6. Verify Node.js Application
      - name: Check Node.js version
        run: node -v

      # Step 7. Verify npm version
      - name: Check npm version
        run: npm -v
